apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name": "gwells-backend:dev", "namespace": "26e83e-tools"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"gwells-backend\")].image", "pause": false}]'
  labels:
    app: gwells-backend
    app-name: gwells
    appver: gwells-backend
    env-name: dev
  name: gwells-backend
  namespace: 26e83e-dev
spec:
