          value: gwells-pg12-development
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              key: database-name
              name: gwells-pg12-development
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: gwells-pg12-development
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: gwells-pg12-development
        - name: DATABASE_SCHEMA
          value: public
        - name: APP_MODULE
          value: wsgi:application
        - name: APP_HOME
          value: backend
        - name: APP_CONFIG
          value: /opt/app-root/src/backend/gunicorn.ocp4.cfg
        - name: DJANGO_SECRET_KEY
