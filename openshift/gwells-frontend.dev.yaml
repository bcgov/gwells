{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "image.openshift.io/triggers": "[{\"from\":{\"kind\":\"ImageStreamTag\",\"name\":\"gwells-application:latest\",\"namespace\":\"26e83e-tools\"},\"fieldPath\":\"spec.template.spec.containers[?(@.name==\\\"gwells-frontend\\\")].image\",\"pause\":false}]"
    },
    "labels": {
      "app": "gwells-frontend",
      "app-name": "gwells",
      "appver": "gwells-frontend",
      "env-name": "development"
    },
    "name": "gwells-frontend",
    "namespace": "26e83e-dev"
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "gwells-frontend"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "creationTimestamp": null,
        "labels": {
          "app": "gwells-frontend"
        }
      },
      "spec": {
        "containers": [
          {
            "env": [
              {
                "name": "VITE_FRONTEND_TILE_URL",
                "value": "https://gwells-frontend-26e83e-dev.apps.silver.devops.gov.bc.ca/gwells/tiles"
              },
              {
                "name": "VITE_AXIOS_BASE_URL",
                "value": "https://gwells-backend-26e83e-dev.apps.silver.devops.gov.bc.ca/gwells/api/v2/"
              }
            ],
            "image": "image-registry.openshift-image-registry.svc:5000/26e83e-tools/gwells-application@sha256:22bc16db23dfe60d5e7f6bbe6a01efff7fe773e64a37b6f18cf3bb722a5e8efa",
            "imagePullPolicy": "Always",
            "name": "gwells-frontend",
            "ports": [
              {
                "containerPort": 8080,
                "protocol": "TCP"
              }
            ],
            "resources": {
              "limits": {
                "cpu": "50m",
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "128Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 30
      }
    }
  }
}