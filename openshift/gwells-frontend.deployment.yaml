apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: gwells-frontend
  annotations:
    description: Template for deploying gwells-frontend with gwells-application image.
labels:
  app: gwells-frontend
  app-name: gwells
  appver: gwells-frontend
objects:
# ----------------- DEPLOYMENT -----------------
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      labels:
        app: gwells-frontend
      name: gwells-frontend
      annotations:
        image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name": "gwells-application:latest",
          "namespace": "26e83e-tools"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"gwells-frontend\")].image",
          "paused": false}]'
    spec:
      progressDeadlineSeconds: 600
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: gwells-frontend
      strategy:
        type: Recreate
      template:
        metadata:
          creationTimestamp: null
          labels:
            app: gwells-frontend
        spec:
          containers:
          - env:
            - name: VITE_FRONTEND_TILE_URL
              value: https://gwells-frontend-26e83e-dev.apps.silver.devops.gov.bc.ca/gwells/tiles
            - name: VITE_AXIOS_BASE_URL
              value: https://gwells-backend-26e83e-dev.apps.silver.devops.gov.bc.ca/gwells/api/v2/
            image: image-registry.openshift-image-registry.svc:5000/26e83e-tools/gwells-application@sha256:bdfccc5b34dce72dc65e0aee6d29a65f350988238e53a6f66756951a98f53e11
            image: image-registry.openshift-image-registry.svc:5000/26e83e-tools/gwells-application:latest
            imagePullPolicy: Always
            name: gwells-frontend
            ports:
            - containerPort: 8080
              protocol: TCP
            resources:
              limits:
                cpu: 50m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 128Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
