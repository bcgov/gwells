apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: matomo-db
  annotations:
    description: Template for deploying matomo-db, an open source database for Matomo analytics.
objects:
# ----------------- DEPLOYMENT -----------------
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      labels:
        app: matomo
      name: matomo-db
      annotations:
        image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"mariadb:latest","namespace":"26e83e-tools"},"fieldPath":"spec.template.spec.containers[?(@.name==\"mariadb\")].image","pause":false}]'
    spec:
      selector:
        matchLabels:
          name: matomo-db
      strategy:
        type: Recreate
      template:
        metadata:
          creationTimestamp: null
          labels:
            app: matomo
            name: matomo-db
        spec:
          containers:
          - name: mariadb
            env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  key: database-user
                  name: matomo-db
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: matomo-db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-root-password
                  name: matomo-db
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  key: database-name
                  name: matomo-db
            image: image-registry.openshift-image-registry.svc:5000/26e83e-tools/mariadb:latest
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              initialDelaySeconds: 30
              periodSeconds: 10
              successThreshold: 1
              tcpSocket:
                port: 3306
              timeoutSeconds: 1
            ports:
            - containerPort: 3306
              protocol: TCP
            readinessProbe:
              exec:
                command:
                - /bin/sh
                - -i
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DATABASE
                  -e 'SELECT 1'
              failureThreshold: 3
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            resources:
              limits:
                cpu: 250m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 100Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /var/lib/mysql/data
              name: matomo-db-data
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
          - name: matomo-db-data
            persistentVolumeClaim:
              claimName: matomo-db
# ----------------- PVC -----------------
  - kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: matomo-db
      finalizers:
        - kubernetes.io/pvc-protection
      labels:
        app: matomo
        name: matomo-db
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: netapp-file-standard
      volumeMode: Filesystem